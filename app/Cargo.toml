[package]
name = "notch"
version = "0.3.0"
edition = "2021"

[dependencies]
eframe = "0.31.1"
chrono = "0.4"
arboard = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Web_Http", "Web_Http_Headers", "Win32_System_WinRT", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Networking_Connectivity", "Devices_Bluetooth", "UI_Notifications", "UI_Notifications_Management", "ApplicationModel", "Foundation_Collections", "Devices_Geolocation", "Media_Ocr", "Graphics_Imaging", "Security_Cryptography", "Storage_Streams", "implement", "Win32_UI_Shell", "Win32_System_Ole", "Win32_System_Memory", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_System_Threading"] }
# Already part of `windows`; named here because #[implement] (the volume callback) refers to it.
windows-core = "0.58"
windows-sys = { version = "0.59", features = ["Win32_System_Power", "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Shell", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_UI_Accessibility", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory"] }

[profile.release]
opt-level = 2
# Smaller download and less code to load: one optimised unit, no debug symbols.
lto = true
codegen-units = 1
strip = true
